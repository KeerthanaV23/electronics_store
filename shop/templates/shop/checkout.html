<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout - ElectroShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <a href="{% url 'product_list' %}" class="text-2xl font-bold">ElectroShop 🚀</a>
        </div>
    </header>

    <main class="container mx-auto p-6 max-w-4xl">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Checkout</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white rounded-lg shadow-md p-6">
                <h3 class="text-lg font-semibold text-gray-700 mb-4">Shipping Details</h3>
                <form method="post" class="space-y-4">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700">Place Order 🚀</button>
                </form>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6">
                <h3 class="text-lg font-semibold text-gray-700 mb-4">Your Order Summary</h3>
                <ul class="space-y-3 border-b pb-4 mb-4">
                    {% for item in cart %}
                        <li class="flex justify-between text-gray-700">
                            <span>{{ item.product.name }} (x{{ item.quantity }})</span>
                            <span class="font-semibold">₹{{ item.total_price }}</span>
                        </li>
                    {% endfor %}
                </ul>
                <div class="flex justify-between items-center text-xl font-bold text-gray-800">
                    <span>Total:</span>
                    <span>₹{{ cart.get_total_price }}</span>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
