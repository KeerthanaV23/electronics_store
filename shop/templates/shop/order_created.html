<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Placed - ElectroShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md text-center max-w-md">
        <h2 class="text-3xl font-bold text-green-600 mb-4">Thank You! 🎉</h2>
        <p class="text-gray-700 mb-2">Your order has been successfully placed.</p>
        <p class="text-gray-600 font-semibold mb-6">Order ID: #{{ order.id }}</p>
        <a href="{% url 'product_list' %}" class="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700">Continue Shopping</a>
    </div>
</body>
</html>
